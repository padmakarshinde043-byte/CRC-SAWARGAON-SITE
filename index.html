<style>

    --navy-700: #142B4D;
    --navy-600: #1B365D;
    --navy-accent: #2563EB;
    --navy-subtle: #F0F5FA;
    --bg-page: #F8FAFC;
    --surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --gold: #D97706;
    --green: #10B981;
    --green-light: #D1FAE5;
    --red: #EF4444;

  header { background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 50%, var(--navy-600) 100%); color: white; padding: 1.2rem 1rem; box-shadow: var(--shadow-md); border-bottom: 3px solid var(--navy-accent); display: flex; align-items: center; gap: 12px; }
  .header-logo-box { width: 50px; height: 50px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; }

  .header-text { text-align: left; flex-grow: 1; }
  .header-badge { display: inline-block; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); color: #93C5FD; font-size: 0.7rem; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-bottom: 4px; }
  header h1 { font-size: 1.2rem; font-weight: 800; line-height: 1.3; }
  header p { font-size: 0.78rem; opacity: 0.88; margin-top: 2px; color: #CBD5E1; }

  /* Marquee */
  .marquee-bar { background: #FEF3C7; color: #92400E; padding: 6px 10px; font-size: 0.82rem; font-weight: 700; border-bottom: 1.5px solid #FDE68A; overflow: hidden; white-space: nowrap; }

  /* Navigation Tabs */

  .nav-tabs { display: flex; max-width: 1100px; margin: 0 auto; padding: 6px 8px; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { flex: 1; min-width: 110px; text-align: center; padding: 8px 10px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); border: none; background: transparent; cursor: pointer; border-radius: var(--radius-md); white-space: nowrap; transition: 0.2s; }
  .nav-tab.active { color: white; background: linear-gradient(135deg, var(--navy-700), var(--navy-600)); box-shadow: 0 3px 8px rgba(27, 54, 93, 0.25); }

  .container { max-width: 1100px; margin: 1rem auto; padding: 0 12px; }
  .card { background: var(--surface); border-radius: var(--radius-lg); padding: 1.2rem; margin-bottom: 1.2rem; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .card-title { font-size: 1.05rem; font-weight: 800; color: var(--navy-800); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; border-bottom: 1px solid var(--navy-subtle); padding-bottom: 8px; }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.2rem; }
  @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card { background: white; padding: 12px 8px; border-radius: var(--radius-lg); border-top: 4px solid var(--navy-accent); box-shadow: var(--shadow-sm); text-align: center; }
  .stat-card h3 { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
  .stat-card .num { font-size: 1.35rem; font-weight: 800; color: var(--navy-800); margin-top: 2px; }

  /* 4 Capsules per row on mobile */
  .school-capsule-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  @media(min-width: 450px) { .school-capsule-grid { grid-template-columns: repeat(4, 1fr); } }
  .school-capsule { background: var(--navy-subtle); border: 1.5px solid var(--border); color: var(--navy-800); padding: 8px 6px; border-radius: var(--radius-md); font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 48px; line-height: 1.2; word-break: break-word; }
  .school-capsule:hover { background: var(--navy-600); color: white; border-color: var(--navy-600); transform: translateY(-1px); }

  /* Dynamic Link Capsules */
  .dynamic-links-box { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .link-capsule { display: flex; align-items: center; justify-content: space-between; background: white; border: 2px solid var(--border); padding: 10px 14px; border-radius: 30px; text-decoration: none; color: var(--navy-800); font-weight: 700; font-size: 0.88rem; transition: 0.2s; box-shadow: var(--shadow-sm); }
  .link-capsule:hover { border-color: var(--navy-accent); background: #F8FAFC; }
  .glow-effect { border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.35); }
  @keyframes flashRed { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  .blink-star { color: #DC2626; font-size: 1rem; animation: flashRed 1s infinite; margin-left: 4px; }

  /* Forms */
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
  @media(min-width: 600px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { font-size: 0.82rem; font-weight: 700; margin-bottom: 5px; color: var(--navy-700); }
  .form-control { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; outline: none; background: white; color: var(--text-main); width: 100%; }
  .form-control:focus { border-color: var(--navy-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }

  .radio-box-group { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 6px 0; }
  @media(min-width: 500px) { .radio-box-group { grid-template-columns: repeat(3, 1fr); } }
  .radio-label { border: 1.5px solid var(--border); padding: 10px 12px; border-radius: var(--radius-md); text-align: center; cursor: pointer; font-weight: 700; font-size: 0.82rem; background: #FAFAFA; }
  input[type="radio"]:checked + .radio-label { border-color: var(--navy-accent); background: var(--navy-subtle); color: var(--navy-accent); }
  input[type="radio"] { display: none; }

  /* Tables & Buttons */
  .table-responsive { overflow-x: auto; margin-top: 8px; border-radius: var(--radius-md); border: 1px solid var(--border); max-height: 450px; }
  table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.82rem; min-width: 500px; }
  th, td { padding: 8px 6px; border: 1px solid #E2E8F0; }
  th { background: var(--navy-600); color: white; font-weight: 700; position: sticky; top: 0; z-index: 2; font-size: 0.78rem; }
  tr:nth-child(2n) { background: #F8FAFC; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-md); border: none; cursor: pointer; transition: 0.2s; width: 100%; }

  .btn-primary { background: var(--navy-600); color: white; box-shadow: 0 3px 8px rgba(27, 54, 93, 0.2); }
  .btn-success { background: var(--green); color: white; }
  .btn-danger { background: var(--red); color: white; }
  .btn-outline { background: white; border: 1.5px solid var(--navy-600); color: var(--navy-600); }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 17, 33, 0.7); backdrop-filter: blur(3px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>

  /* नॅव्हिगेशन टॅब्ज रेंडर करणे */
  function renderNavTabs() {
    const container = document.getElementById('navTabsContainer');
    container.innerHTML = '';
    navTabs.forEach((tab, index) => {
      let btn = document.createElement('button');
      btn.className = `nav-tab ${index === 0 ? 'active' : ''}`;
      btn.textContent = tab.name;
      btn.onclick = (e) => switchTab(tab.id, e.currentTarget);
      container.appendChild(btn);
    });
  }

  function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(nt => nt.classList.remove('active'));
    let target = document.getElementById(tabId);
    if(target) target.classList.add('active');
    if(btnElement) btnElement.classList.add('active');
  }

  /* पब्लिक लिंक्स रेंडर */
  function renderPublicLinks() {
    const container = document.getElementById('publicLinksContainer');
    if(!container) return;
    container.innerHTML = '';
    if(customLinks.length === 0) {
      container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); text-align:center;">सध्या कोणतीही लिंक नाही.</p>';
      return;
    }
    customLinks.forEach(l => {
      let a = document.createElement('a');
      a.className = `link-capsule ${l.glow ? 'glow-effect' : ''}`;
      a.href = l.url;
      a.target = "_blank";
      a.innerHTML = `<span>📌 ${l.title} ${l.star ? '<span class="blink-star">⭐ NEW</span>' : ''}</span><span style="font-size:1rem;">👉</span>`;
      container.appendChild(a);
    });
  }

  /* शाळा कॅप्सूल (4 per row) */
  function renderSchoolCapsules() {
    const container = document.getElementById('schoolCapsuleContainer');
    if(!container) return;
    container.innerHTML = '';
    schoolsData.forEach(s => {
      let cap = document.createElement('div');
      cap.className = 'school-capsule';
      cap.textContent = `${s.id}. ${s.name}`;
      cap.onclick = () => openSchoolModal(s);
      container.appendChild(cap);
    });
  }

  function renderSchoolDropdown() {
    const select = document.getElementById('mr_school');
    if(!select) return;
    select.innerHTML = '<option value="">-- शाळा निवडा --</option>';
    schoolsData.forEach(s => {
      let opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = `${s.id}. ${s.name}`;
      select.appendChild(opt);
    });
  }

  /* शाळा क्लिक केल्यावर संपूर्ण माहिती पॉपअप (शिक्षक, मोबाईल, वर्ग व जातनिहाय संख्या) */
  function openSchoolModal(s) {
    document.getElementById('modalSchoolName').textContent = `${s.id}. ${s.name} (UDISE: ${s.udise})`;
    
    let teachersHtml = s.teachers.map(t => `• ${t.name} - <a href="tel:${t.phone}" style="color:var(--navy-accent); font-weight:700;">${t.phone}</a>`).join('<br>');
    
    let classHtml = Object.entries(s.classCounts).map(([cls, cnt]) => `<tr><td>${cls}</td><td style="font-weight:700;">${cnt}</td></tr>`).join('');
    let catHtml = Object.entries(s.categoryCounts).map(([cat, cnt]) => `<tr><td>${cat}</td><td style="font-weight:700;">${cnt}</td></tr>`).join('');

    document.getElementById('modalSchoolBody').innerHTML = `
      <p style="margin-bottom:6px;"><strong>वर्ग रचना:</strong> ${s.classes}</p>
      <p style="margin-bottom:6px;"><strong>एकूण पटसंख्या:</strong> ${s.total} विद्यार्थी</p>
      <div style="margin: 8px 0; background: var(--navy-subtle); padding: 8px; border-radius: var(--radius-sm);">
        <strong>शिक्षक व मोबाईल क्रमांक:</strong><br>${teachersHtml}
      </div>
      <div style="font-weight:700; margin-top:8px; color:var(--navy-700);">वर्गानुसार विद्यार्थी संख्या:</div>
      <div class="table-responsive" style="margin-top:4px; max-height:150px;">
        <table><thead><tr><th>इयत्ता</th><th>संख्या</th></tr></thead><tbody>${classHtml}</tbody></table>
      </div>
      <div style="font-weight:700; margin-top:8px; color:var(--navy-700);">प्रवर्ग / जातनिहाय संख्या:</div>
      <div class="table-responsive" style="margin-top:4px; max-height:150px;">
        <table><thead><tr><th>प्रवर्ग</th><th>संख्या</th></tr></thead><tbody>${catHtml}</tbody></table>
      </div>
    `;
    document.getElementById('schoolModal').style.display = 'flex';
  }

  function closeSchoolModal() {
    document.getElementById('schoolModal').style.display = 'none';
  }

  function toggleReportFields(show) {
    let f = document.getElementById('dynamicChangeFields');
    if(f) f.style.display = show ? 'block' : 'none';
  }

  function submitReport() {
    let school = document.getElementById('mr_school').value;
    if(!school) { alert('कृपया शाळा निवडा!'); return; }
    showToast('माहिती यशस्वीपणे सबमिट झाली! ✅');
    document.getElementById('mr_school').value = '';
    document.querySelector('input[name="changeType"][value="none"]').click();
  }

  /* ॲडमिन पिन (3506) */
  function verifyAdminPin() {
    let pin = document.getElementById('adminPinInput').value;
    if(pin === '3506') {
      document.getElementById('adminLoginBox').style.display = 'none';
      document.getElementById('adminDashboardContent').style.display = 'block';
      let badge = document.getElementById('adminStatusBadge');
      badge.textContent = 'सक्रिय (Unlocked)';
      badge.className = 'admin-badge badge-unlocked';
      showToast('ॲडमिन पॅनल अनलॉक झाले! 🔓');
    } else {
      alert('चुकीचा पिन! (योग्य पिन: 3506)');
    }
  }

  function updateMarqueeText() {
    let txt = document.getElementById('adminMarqueeInput').value;
    if(!txt) { alert('कृपया मेसेज लिहा.'); return; }
    marqueeMessage = txt;
    localStorage.setItem('sawargaon_marquee', marqueeMessage);
    document.getElementById('marqueeTextDisplay').textContent = marqueeMessage;
    showToast('सरकणारा मेसेज अपडेट झाला! 💾');
  }

  function addNewLink() {
    let title = document.getElementById('linkTitleInput').value;
    let url = document.getElementById('linkUrlInput').value;
    let glow = document.getElementById('linkGlowInput').checked;
    let star = document.getElementById('linkStarInput').checked;
    if(!title || !url) { alert('शीर्षक आणि URL दोन्ही भरा.'); return; }
    customLinks.push({ id: Date.now(), title, url, glow, star });
    localStorage.setItem('sawargaon_links', JSON.stringify(customLinks));
    document.getElementById('linkTitleInput').value = '';
    document.getElementById('linkUrlInput').value = '';
    renderPublicLinks();
    showToast('नवीन लिंक यशस्वीपणे जोडली! 🚀');
  }

  /* टॅब व्यवस्थापन (जोडणे व डिलीट करणे) */
  function renderAdminTabsManager() {
    const list = document.getElementById('adminTabsListContainer');
    if(!list) return;
    list.innerHTML = '';
    navTabs.forEach((t, idx) => {
      let div = document.createElement('div');
      div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:white; padding:6px 10px; border-radius:6px; border:1px solid var(--border); font-size:0.82rem;";
      div.innerHTML = `<span><b>${t.name}</b> (${t.id})</span> ${navTabs.length > 2 ? `<button class="btn btn-danger" style="padding:2px 8px; font-size:0.7rem;" onclick="deleteTab('${t.id}')">कमी करा ❌</button>` : ''}`;
      list.appendChild(div);
    });
  }

  function addNewTab() {
    let name = document.getElementById('newTabNameInput').value;
    let id = document.getElementById('newTabIdInput').value;
    if(!name || !id) { alert('कृपया टॅबचे नाव आणि आयडी दोन्ही भरा.'); return; }
    navTabs.push({ id, name });
    localStorage.setItem('sawargaon_nav_tabs', JSON.stringify(navTabs));
    document.getElementById('newTabNameInput').value = '';
    document.getElementById('newTabIdInput').value = '';
    renderNavTabs();
    renderAdminTabsManager();
    showToast('नवीन टॅब जोडला गेला! ✨');
  }

  function deleteTab(id) {
    navTabs = navTabs.filter(t => t.id !== id);
    localStorage.setItem('sawargaon_nav_tabs', JSON.stringify(navTabs));
    renderNavTabs();
    renderAdminTabsManager();
    showToast('टॅब कमी केला गेला! 🗑️');
  }

  function renderAdminSchoolTable() {
    const tbody = document.getElementById('adminSchoolStatusTableBody');
    if(!tbody) return;
    tbody.innerHTML = '';
    schoolsData.forEach((s, idx) => {
      let isDone = schoolStatuses[s.id] || false;
      tbody.innerHTML += `
        <tr>
          <td>${idx + 1}</td>
          <td style="font-weight:700;">${s.name}</td>
          <td>${s.teachers[0].name}<br><span style="font-size:0.7rem; color:var(--text-muted);">${s.teachers[0].phone}</span></td>
          <td>
            <select class="form-control" style="padding:4px; font-size:0.78rem;" onchange="updateSchoolStatus(${s.id}, this.value)">
              <option value="false" ${!isDone ? 'selected' : ''}>अपूर्ण ⏳</option>
              <option value="true" ${isDone ? 'selected' : ''}>पूर्ण ✅</option>
            </select>
          </td>
          <td>
            <button class="btn btn-success" style="padding:4px 8px; font-size:0.75rem;" onclick="sendWhatsApp(${s.id})">💬 मेसेज</button>
          </td>
        </tr>
      `;
    });
  }

  function updateSchoolStatus(schoolId, val) {
    schoolStatuses[schoolId] = (val === 'true');
    localStorage.setItem('sawargaon_statuses', JSON.stringify(schoolStatuses));
    showToast('शाळेची स्थिती जतन केली! 💾');
  }

  function sendWhatsApp(schoolId) {
    let s = schoolsData.find(x => x.id === schoolId);
    let isDone = schoolStatuses[s.id] || false;
    let statusText = isDone ? "माहिती भरण्याचे काम पूर्ण केले आहे, धन्यवाद! 👍" : "माहिती भरण्याचे काम प्रलंबित आहे, कृपया लवकरात लवकर पूर्ण करावी. ⚠️";
    let message = `नमस्कार सर/मॅडम (${s.teachers[0].name}),\n\nसमूह साधन केंद्र सावरगाव अंतर्गत शाळा: *${s.name}* \n\nस्थिती: *${statusText}*\n\n- केंद्रप्रमुख, सावरगाव`;
    let encodedUrl = `https://wa.me/91${s.teachers[0].phone}?text=${encodeURIComponent(message)}`;
    window.open(encodedUrl, '_blank');
  }

  window.onload = initApp;
</script>

</body>
</html>
