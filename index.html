  function showToast(msg) {
    let t = document.getElementById('toastMessage');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 2000);
  }

  function switchTab(tabId, btnElement, pushHistory = true) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(nt => nt.classList.remove('active'));
    let target = document.getElementById(tabId);
    if(target) target.classList.add('active');
    if(btnElement) btnElement.classList.add('active');

    if(pushHistory) {
      history.pushState({view: 'tab', tabId: tabId}, "", "#" + tabId);
    }
  }

  window.addEventListener('popstate', (event) => {
    if(event.state && event.state.view === 'school') {
      renderDashboard();
    } else if(event.state && event.state.view === 'admin') {
      renderFullAdminView();
    } else {
      renderDashboard();
    }
  });

  function initApp() {
    document.getElementById('marqueeTextDisplay').textContent = marqueeMessage;
    renderNavTabs();
    renderDashboard();
    history.replaceState({view: 'tab', tabId: 'dashboardTab'}, "", "#dashboardTab");
  }

  function renderNavTabs() {
    let container = document.getElementById('navTabsContainer');
    container.innerHTML = '';
    navTabs.forEach((tab, index) => {
      let btn = document.createElement('button');
      btn.className = `nav-tab ${index === 0 ? 'active' : ''}`;
      btn.textContent = tab.name;
      btn.onclick = (e) => switchTab(tab.id, e.currentTarget);
      container.appendChild(btn);
    });
  }

    let txt = document.getElementById('adminMarqueeInput').value;

    marqueeMessage = txt;
    localStorage.setItem('sawargaon_marquee', marqueeMessage);
    document.getElementById('marqueeTextDisplay').textContent = marqueeMessage;
    showToast('सरकणारा मेसेज अपडेट झाला! 💾');

  function addNewLink() {
    let title = document.getElementById('linkTitleInput').value;
    let url = document.getElementById('linkUrlInput').value;
    let glow = document.getElementById('linkGlowInput').checked;
    let star = document.getElementById('linkStarInput').checked;
    if(!title || !url) { alert('शीर्षक आणि URL दोन्ही भरा.'); return; }
    customLinks.push({ id: Date.now(), title, url, glow, star });
    localStorage.setItem('sawargaon_links', JSON.stringify(customLinks));
    renderFullAdminView();
    showToast('नवीन लिंक यशस्वीपणे जोडली! 🚀');

  function deleteAdminLink(id) {
    customLinks = customLinks.filter(l => l.id !== id);
    localStorage.setItem('sawargaon_links', JSON.stringify(customLinks));
    renderFullAdminView();
    showToast('लिंक काढून टाकली! 🗑️');
  }

  function addNewTab() {
    let name = document.getElementById('newTabNameInput').value;
    let id = document.getElementById('newTabIdInput').value;
    if(!name || !id) { alert('टॅबचे नाव आणि आयडी भरा.'); return; }
    navTabs.push({ id, name });
    localStorage.setItem('sawargaon_nav_tabs', JSON.stringify(navTabs));
    renderNavTabs();
    renderFullAdminView();
    showToast('नवीन टॅब जोडला गेला! ✨');
  }

  function deleteAdminTab(id) {
    navTabs = navTabs.filter(t => t.id !== id);
    localStorage.setItem('sawargaon_nav_tabs', JSON.stringify(navTabs));
    renderNavTabs();
    renderFullAdminView();
    showToast('टॅब कमी केला गेला! 🗑️');
  }

  function addNewPrivateSchool() {
    let name = document.getElementById('p_name').value;
    let udise = document.getElementById('p_udise').value;
    let classes = document.getElementById('p_classes').value;
    let total = document.getElementById('p_total').value;
    let hmStr = document.getElementById('p_hm').value;

    if(!name || !total) { alert('कृपया शाळेचे नाव आणि पटसंख्या भरा.'); return; }

    let privates = JSON.parse(localStorage.getItem('sawargaon_private_schools')) || [];
    let newSchool = {
      id: Date.now(),
      name: name,
      udise: udise || "N/A",
      classes: classes || "1 To 4",
      total: Number(total),
      type: "PRIVATE",
      teachers: [{name: hmStr || "Headmaster", phone: "9876543210"}],
      classCounts: {"Class 1": Math.floor(total/4), "Class 2": Math.floor(total/4), "Class 3": Math.floor(total/4), "Class 4": total - (3 * Math.floor(total/4))},
      categoryCounts: {"SC": 10, "ST": 5, "OBC": 10, "GENERAL": total - 25}
    };

    privates.push(newSchool);
    localStorage.setItem('sawargaon_private_schools', JSON.stringify(privates));
    privateSchoolsData = privates;
    renderFullAdminView();
    showToast('खाजगी शाळा यशस्वीपणे जोडली गेली! ✅');
  }

  function updateSchoolStatus(schoolId, val) {
    schoolStatuses[schoolId] = (val === 'true');
    localStorage.setItem('sawargaon_statuses', JSON.stringify(schoolStatuses));
    showToast('स्थिती जतन केली! 💾');
  }

  function sendWhatsApp(schoolId) {
    let all = [...zpschoolsData, ...privateSchoolsData];
    let s = all.find(x => x.id === schoolId);
    let isDone = schoolStatuses[s.id] || false;
    let statusText = isDone ? "माहिती भरण्याचे काम पूर्ण केले आहे, धन्यवाद! 👍" : "माहिती भरण्याचे काम प्रलंबित आहे, कृपया लवकरात लवकर पूर्ण करावी. ⚠️";
    let message = `नमस्कार सर/मॅडम (${s.teachers[0].name}),\n\nसमूह साधन केंद्र सावरगाव अंतर्गत शाळा: *${s.name}* \n\nस्थिती: *${statusText}*\n\n- केंद्रप्रमुख, सावरगाव`;
    let encodedUrl = `https://wa.me/91${s.teachers[0].phone}?text=${encodeURIComponent(message)}`;
    window.open(encodedUrl, '_blank');
  }

  function renderReportDropdown() {
    let select = document.getElementById('mr_school');
    if(!select) return;
    let all = [...zpschoolsData, ...privateSchoolsData];
    select.innerHTML = '<option value="">-- शाळा निवडा --</option>';
    all.forEach(s => {
      let opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = `${s.id}. ${s.name} (${s.type})`;
      select.appendChild(opt);
    });
  }

  /* FULL-PAGE VERTICAL SCHOOL VIEW (No Horizontal Scrolling) */
  function openFullSchoolView(schoolId, type) {
    let all = type === 'PRIVATE' ? privateSchoolsData : zpschoolsData;
    let s = all.find(x => x.id === schoolId);
    if(!s) return;

    history.pushState({view: 'school', schoolId: schoolId}, "", "#school-" + schoolId);

    let container = document.getElementById('mainContainerViews');
    let teachersHtml = s.teachers.map(t => `• ${t.name} - <a href="tel:${t.phone}" style="color:#D97706; font-weight:800;">${t.phone}</a>`).join('<br>');
    
    let classHtml = s.classCounts ? Object.entries(s.classCounts).map(([cls, cnt]) => `<tr><td>${cls}</td><td style="font-weight:800;">${cnt}</td></tr>`).join('') : '<tr><td colspan="2">माहिती नाही</td></tr>';
    let catHtml = s.categoryCounts ? Object.entries(s.categoryCounts).map(([cat, cnt]) => `<tr><td>${cat}</td><td style="font-weight:800;">${cnt}</td></tr>`).join('') : '<tr><td colspan="2">माहिती नाही</td></tr>';

    container.innerHTML = `
      <div class="card" style="border: 3px solid #1B365D;">
        <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>🏫 ${s.id}. ${s.name} (${s.type})</span>
          <button class="btn btn-outline" style="padding:6px 12px; font-size:0.8rem; width:auto;" onclick="goBackToDashboard()">⬅ मागे जा</button>
        </div>
        <div style="font-size: 0.88rem; line-height: 1.6;">
          <p><strong>UDISE Code:</strong> ${s.udise || 'N/A'} | <strong>वर्ग:</strong> ${s.classes} | <strong>एकूण पट:</strong> ${s.total}</p>
          <div style="margin: 10px 0; background: #F8FAFC; padding: 10px; border-radius: 8px; border: 2px solid var(--border);">
            <strong>शिक्षक व मोबाईल क्रमांक:</strong><br>${teachersHtml}
          </div>
          
          <!-- Stacked vertically with zero horizontal scrolling -->
          <div style="display:flex; flex-direction:column; gap: 12px; margin-top: 10px;">
            <div>
              <div style="font-weight:800; color:#1E3A8A; font-size:0.85rem; margin-bottom:4px;">इयत्तानिहाय विद्यार्थी संख्या:</div>
              <div class="table-responsive"><table><thead><tr><th>इयत्ता</th><th>संख्या</th></tr></thead><tbody>${classHtml}</tbody></table></div>
            </div>
            <div>
              <div style="font-weight:800; color:#1E3A8A; font-size:0.85rem; margin-bottom:4px;">प्रवर्गनिहाय विद्यार्थी संख्या:</div>
              <div class="table-responsive"><table><thead><tr><th>प्रवर्ग</th><th>संख्या</th></tr></thead><tbody>${catHtml}</tbody></table></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function goBackToDashboard() {
    renderDashboard();
    history.pushState({view: 'tab', tabId: 'dashboardTab'}, "", "#dashboardTab");
  }

  function renderSummaryHtml() {
    let zpTotalStudents = zpschoolsData.reduce((acc, s) => acc + Number(s.total), 0);
    let privateTotalStudents = privateSchoolsData.reduce((acc, s) => acc + Number(s.total), 0);
    let combinedStudents = zpTotalStudents + privateTotalStudents;

    let zpTeachers = 73;
    let privTeachers = privateSchoolsData.reduce((acc, s) => acc + (s.teachers ? s.teachers.length : 1), 0);

    return `
      <div class="card">
        <div class="card-title"><span>📊 जिल्हा परिषद (ZP) शाळा गोषवारा</span></div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>घटक</th><th>तपशील</th></tr></thead>
            <tbody>
              <tr><td>एकूण जि.प. शाळा</td><td style="font-weight:800;">${zpschoolsData.length}</td></tr>
              <tr><td>एकूण जि.प. शिक्षक</td><td style="font-weight:800;">${zpTeachers}</td></tr>
              <tr><td>एकूण विद्यार्थी पटसंख्या</td><td style="font-weight:800; color:#10B981;">${zpTotalStudents}</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span>📊 खाजगी शाळा गोषवारा</span></div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>घटक</th><th>तपशील</th></tr></thead>
            <tbody>
              <tr><td>एकूण खाजगी शाळा</td><td style="font-weight:800;">${privateSchoolsData.length}</td></tr>
              <tr><td>एकूण खाजगी शिक्षक</td><td style="font-weight:800;">${privTeachers}</td></tr>
              <tr><td>एकूण विद्यार्थी पटसंख्या</td><td style="font-weight:800; color:#F59E0B;">${privateTotalStudents}</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card" style="border: 3px solid #10B981;">
        <div class="card-title" style="color:#10B981;"><span>📊 केंद्र-स्तरीय एकत्रित गोषवारा</span></div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>घटक</th><th>एकूण संख्या</th></tr></thead>
            <tbody>
              <tr><td>एकूण शाळा (जि.प. + खाजगी)</td><td style="font-weight:800;">${zpschoolsData.length + privateSchoolsData.length}</td></tr>
              <tr><td>एकूण कार्यरत शिक्षक</td><td style="font-weight:800;">${zpTeachers + privTeachers}</td></tr>
              <tr><td>एकूण विद्यार्थी पटसंख्या</td><td style="font-weight:800; color:#1B365D;">${combinedStudents}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function toggleReportFields(show) {
    let f = document.getElementById('dynamicChangeFields');
    if(f) f.style.display = show ? 'block' : 'none';
  }

  function submitReport() {
    let school = document.getElementById('mr_school').value;
    if(!school) { alert('कृपया शाळा निवडा!'); return; }
    showToast('अहवाल यशस्वीपणे सबमिट झाला! ✅');
    document.getElementById('mr_school').value = '';
    document.querySelector('input[name="changeType"][value="none"]').click();
  }

  window.onload = initApp;
</script>
</body>
</html>
